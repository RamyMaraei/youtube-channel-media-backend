<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Channel Media Tool</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#121212;
      --muted:#5b5b5b;
      --border:#e6e6e6;
      --primary:#ff002b;
      --btn:#1e1e1e;
      --btnText:#ffffff;
      --shadow:0 8px 30px rgba(0,0,0,.08);
      --radius:14px;
    }
    body.dark{
      --bg:#121212;
      --card:#1e1e1e;
      --text:#f0f0f0;
      --muted:#b7b7b7;
      --border:#2b2b2b;
      --btn:#333333;
      --btnText:#ffffff;
      --shadow:0 10px 34px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Alexandria,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{max-width:1100px;margin:22px auto;padding:0 16px}

    .top{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
    }

    .brand{
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:10px;
    }
    .brand img{
      height:32px;
      width:auto;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .spacer{flex:1}

    input{
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      min-width:280px;
      flex:1;
      outline:none;
    }

    button{
      border:none;
      border-radius:12px;
      padding:12px 14px;
      background:var(--btn);
      color:var(--btnText);
      cursor:pointer;
      font-weight:700;
    }
    button.secondary{
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
    }
    button.primary{
      background:var(--primary);
      color:#fff;
    }
    button:disabled{opacity:.55;cursor:not-allowed}

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      width:100%;
      margin-top:10px;
    }

    .tabs{
      display:flex;
      gap:8px;
      margin:16px 0;
      flex-wrap:wrap;
    }
    .tab{
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--card);
      cursor:pointer;
      font-weight:700;
    }
    .tab.active{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(255,0,43,.15);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:14px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
    }
    .thumb{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      background:#000;
    }
    .cbody{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .title{
      font-weight:700;
      font-size:13px;
      line-height:1.3;
    }
    .meta{
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .btns button{
      padding:10px 11px;
      font-size:12px;
      border-radius:10px;
    }

    .footer{
      margin:26px 0 18px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:18px;
      background:var(--card);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      padding:10px 12px;
      border-radius:12px;
      max-width:90vw;
      font-size:12px;
      display:none;
    }
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <img id="brandLogo" alt="ALFAN">
    </div>

    <div class="controls">
      <button id="themeBtn" class="secondary">Dark</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="downloadAllBtn" class="primary" disabled>Download Page (ZIP)</button>
      <div class="spacer"></div>
    </div>

    <div class="row">
      <input id="channelInput" placeholder="Paste Channel URL, Channel ID (UC...), or @handle">
      <button id="loadBtn" class="primary">Load</button>
    </div>

    <div class="row">
      <div class="small" id="status"></div>
    </div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab active" data-tab="long">Long</div>
    <div class="tab" data-tab="shorts">Shorts</div>
    <div class="tab" data-tab="playlists">Playlists</div>
  </div>

  <div id="content"></div>

  <div class="footer">© 2026 Alfan Co. – Designed and developed by Ramy Maraei</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "https://youtube-channel-media-backend-production.up.railway.app";

const LOGO_LIGHT = "https://ramymaraei.github.io/banner-checker/ALFAN_LOGO-Small.png";
const LOGO_DARK  = "https://ramymaraei.github.io/banner-checker/ALFAN_LOGO-LIGHT-Small.png";

const els = {
  themeBtn:document.getElementById("themeBtn"),
  resetBtn:document.getElementById("resetBtn"),
  loadBtn:document.getElementById("loadBtn"),
  channelInput:document.getElementById("channelInput"),
  tabs:document.getElementById("tabs"),
  content:document.getElementById("content"),
  status:document.getElementById("status"),
  toast:document.getElementById("toast"),
  downloadAllBtn:document.getElementById("downloadAllBtn"),
  brandLogo:document.getElementById("brandLogo")
};

function updateLogo(){
  els.brandLogo.src = document.body.classList.contains("dark")
    ? LOGO_DARK
    : LOGO_LIGHT;
}

function setTheme(mode){
  if(mode==="dark"){
    document.body.classList.add("dark");
    els.themeBtn.textContent="Light";
    localStorage.setItem("theme","dark");
  }else{
    document.body.classList.remove("dark");
    els.themeBtn.textContent="Dark";
    localStorage.setItem("theme","light");
  }
  updateLogo();
}

(function initTheme(){
  setTheme(localStorage.getItem("theme")==="dark"?"dark":"light");
})();
</script>

</body>
</html>
